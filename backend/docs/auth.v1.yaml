openapi: 3.0.0
info:
  title: API Auth v1
  version: 1.0.0
servers:
  - url: http://localhost:8000/api/v1
paths:
  /register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - password
                - password_confirmation
                - role
              properties:
                name:
                  type: string
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
                password_confirmation:
                  type: string
                  format: password
                role:
                  type: string
                  enum: [ADMIN, CLIENT]
      responses:
        '201':
          description: User registered successfully
        '422':
          description: Validation error
  /login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials
  /logout:
    post:
      summary: Logout user
      tags:
        - Auth
      security:
        - sanctum: []
      responses:
        '200':
          description: Logout successful
components:
  securitySchemes:
    sanctum:
      type: http
      scheme: bearer
      bearerFormat: JWT
